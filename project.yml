#
# Optional XcodeGen specification.
#
# The repository already contains a committed GitFolderUploader.xcodeproj, so
# neither developers nor CI need XcodeGen. This file exists only as a second
# way to regenerate the project if you prefer XcodeGen over the bundled
# Scripts/generate_xcodeproj.py:
#
#     brew install xcodegen && xcodegen generate
#
# Keep the two generators in sync when you change build settings.
#

name: GitFolderUploader

options:
  bundleIdPrefix: com.gitfolderuploader
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "NO"

targets:
  GitFolderUploader:
    type: application
    platform: iOS
    sources:
      - path: GitFolderUploader
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_NAME: GitFolderUploader
        PRODUCT_BUNDLE_IDENTIFIER: com.gitfolderuploader.app
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: GitFolderUploader/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_PREVIEWS: "YES"
        SWIFT_STRICT_CONCURRENCY: minimal
    scheme:
      testTargets: []
      configVariants: []
